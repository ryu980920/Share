# =====================================================================
# 최종 baseline 파라미터 — 프로젝트 수치의 단일 기준
#
# 최종 제출 보고서와 일치하도록 2026-08-27에 정리했다.
# 과거 provisional/TODO 상태는 git 이력과 competition 저장소에서 확인한다.
# =====================================================================

meta:
  project_title: "FinFET pMOS Embedded SiGe S/D의 응력 전달 효율(STE) 특성화 및 실용적 공정 마진 도출"
  final_state: true
  last_verified: "2026-08-27"
  final_report: "ryu980920/competition/docs/reports/경진대회_보고서.docx"

geometry:
  L_gate_nm: 25.0
  fin_height_nm: 35.0
  fin_width_top_nm: 15.0
  fin_width_bottom_nm: 15.0
  Esd_nm: 7.5

doping:
  sd_type: "p"
  sd_species: "Boron"
  sd_concentration_cm3: 2.0e20
  channel_concentration_cm3: 2.0e18

electrical:
  Vdd_V: 0.8
  gate_workfunction_eV: 4.623

crystal:
  channel_direction: "<110>"
  substrate_orientation: "(100)"

materials:
  channel: "Silicon"
  embedded_sd: "SiGe"

# ---------------------------------------------------------------------
# 본 5x5 설계실험
# 추가 FR=15/22 nm 검증점은 본 회귀 격자에 섞지 않고
# baseline/verification_FR_refine_G50.csv에 별도로 유지한다.
# ---------------------------------------------------------------------
doe:
  x_name: "Ge_percent"
  x_levels: [30, 40, 50, 60, 70]
  y_name: "FR_nm"
  y_levels: [0, 10, 20, 30, 35]
  baseline_point: "G50_F0"
  values_confirmed: true
  completed_points: 25
  total_points: 25

# ---------------------------------------------------------------------
# Stress Transfer Efficiency — 최종 확정 정의
#
# STE = |stress_GPa| / (M * 0.042 * x)
# x = Ge_percent / 100
# stress_GPa = SlFin_MPa / 1000
# ---------------------------------------------------------------------
stress_transfer_efficiency:
  adopted: true
  numerator_metric: "SlFin"
  numerator_definition: "ChFin 영역의 채널 길이 방향 체적평균 응력"
  stress_output_unit: "GPa"
  vegard_coefficient: 0.042
  biaxial_modulus_GPa: 180.0
  formula: "abs(stress_GPa) / (biaxial_modulus_GPa * vegard_coefficient * (Ge_percent / 100))"
  selection_basis:
    volume_average_gmSat_correlation: ">= +0.95 for all five Ge conditions"
    interface_point_mean_correlation: "about -0.207"
    decision: "실제 이동도 변화와의 물리적 정합성을 기준으로 체적평균 SlFin을 최종 STE 분자로 채택"

# ---------------------------------------------------------------------
# 최종 설계 해석
# ---------------------------------------------------------------------
design_window:
  practical_FR_nm: [15, 20]
  reason: "STE 포화 이후 SSlin/Ioff 비용이 급증하며 FR=20 nm를 경계로 이득/대가 비율이 약 7.6배 감소"
  FR_15_to_20_gain_cost_ratio: 2.91
  FR_20_to_22_gain_cost_ratio: 0.38
  FR_22_Ioff_norm: 1.93e-9

# ---------------------------------------------------------------------
# 검증 기록
# ---------------------------------------------------------------------
verification:
  strain_impact_coupling:
    status: "confirmed"
    point: "G50_F0"
    result: "Strain_Impact 1/0 비교에서 IdSat_norm +227% 차이 — 응력-전기 결합 정상"
    evidence: "baseline/verification_strain_impact_G50F0.csv"

  fr_geometry:
    status: "confirmed"
    point: "G50_F15"
    result: "좌표축 단면에서 의도한 15 nm 추가 리세스 확인"

  reproducibility:
    status: "confirmed"
    result: "동일 조건 4쌍 독립 재실행 편차 0.0%"

  fr_refinement:
    status: "confirmed"
    points: ["G50_F15", "G50_F22"]
    evidence: "baseline/verification_FR_refine_G50.csv"
    conclusion: "실용 설계창 상한을 FR 20 nm로 확정"

  strain_impact_fr_sweep:
    status: "confirmed"
    evidence: "baseline/verification_strain_impact_G50_FRsweep.csv"
    conclusion: "깊은 FR의 정전제어·누설 열화는 형상 변화가 1차 원인"

  fin_width_sensitivity:
    status: "confirmed"
    baseline_width_nm: 15.0
    comparison_width_nm: 7.5
    ge_levels: [60, 70]
    evidence: "baseline/verification_finwidth_half_G60_G70.xlsx"
    conclusion: "얕은 FR에서는 정전제어와 STE 개선, 깊은 FR에서는 역전 — 미세화될수록 FR 상한이 더 엄격"

# ---------------------------------------------------------------------
# 해석 범위
# ---------------------------------------------------------------------
scope:
  Ge_percent: [30, 70]
  FR_nm: [0, 35]
  extrapolation_outside_range: false
  notes:
    - "Ge 효과는 70%에서도 포화하지 않았으므로 70%를 최적점으로 해석하지 않는다."
    - "STE 절대값은 M=180 GPa 가정에 의존한다."
    - "FinFET 수치 결과를 GAA에 직접 외삽하지 않는다."
