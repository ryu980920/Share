# =====================================================================
#  베이스라인 파라미터 — 이 파일이 모든 수치의 유일한 출처(Single Source of Truth)
#
#  ★ 이번 프로젝트는 논문 재현이 아니라 Sentaurus Applications Library 의
#    FinFET_14nm / FinFET_22nm 예제를 구조 출발점으로 쓴다.
#  ★ 이 예제가 Intel 22nm Tri-Gate / PTM 14nm 에 대응한다는 것은 파일명 기반
#    추측일 뿐 미검증이다 (docs/technical-notes.md 1-2절 항목 1 참고).
#  ★ 아래 값 중 값이 비어있거나 "PLACEHOLDER"라고 적힌 것은 전부 Phase 0에서
#    예제 파일을 직접 열어 확정해야 한다. 확정 전까지는 이 파일의 어떤 숫자도
#    "baseline 값"으로 인용하지 말 것.
#
#  ★ 수정하려면 PR + 나머지 1인 승인. 직접 push 금지.
#  ★ SDE / SDevice / analysis 스크립트가 모두 이 파일을 참조한다.
# =====================================================================

meta:
  baseline_source: "Synopsys Sentaurus Applications Library — FinFET_14nm / FinFET_22nm 예제"
  baseline_paper: null            # 이번 프로젝트는 논문 재현이 아니므로 없음
  example_correspondence_verified: false   # FinFET_14nm=PTM14nm, FinFET_22nm=Intel22nm 대응 확인 여부
  last_verified: "2026-08-04"
  verified_by: ""                 # 예제 파일을 직접 열어 대조한 사람 이름 (Phase 0에서 채울 것)

geometry:
  # ↓ 전부 PLACEHOLDER. FinFET_14nm/22nm 예제를 열어 실제 값으로 교체할 것 (Phase 0 #1 과제)
  L_gate_nm:                # 게이트 길이
  fin_height_nm:             # 핀 높이
  fin_width_nm:               # ★ Luryi-Suhir 보정식(W < 15×Tc)의 W. 확정 최우선
  fin_pitch_nm:
  recess_depth_nm:            # ★스윕 변수 Y의 기준값(공칭) — 확정 전까지 사용 금지
  device_width_um: 1.0        # 전류/응력 정규화 폭 (필요시)

materials:
  channel: "Silicon"
  epi_sd: "SiGe"               # Embedded Source/Drain 재질
  ge_fraction_nominal:        # ★스윕 변수 X의 기준값(공칭) — Phase 0에서 확정
  gate_metal:                  # PLACEHOLDER — 예제에서 확인
  gate_workfunction_eV:        # PLACEHOLDER — 예제에서 확인
  gate_oxide:                  # PLACEHOLDER — 예제에서 확인

doping:
  channel_type: "n"            # PMOS 응력공학이므로 채널은 n형, S/D는 p형(SiGe:B)
  channel_conc_cm3:            # PLACEHOLDER — 예제에서 확인
  sd_type: "p"
  sd_boron_conc_cm3:           # PLACEHOLDER — 예제 또는 문헌(Intel 22nm: 1~3e20, 미확인 대응) 참고

bias:
  # PMOS 응력공학이라 필요시 Vth/Ion 등 보조 지표용. 헤드라인은 응력/이동도.
  Vd:                        # PLACEHOLDER
  Vg_min:
  Vg_max:
  Vg_step:

# --- DoE 격자 정의 (analysis 스크립트가 읽는다) -------------------------
# ⚠⚠⚠ 아래 x_levels/y_levels는 확정값이 아니라 파이프라인이 돌아가는지
#     확인하기 위한 예시(placeholder)다. Phase 0에서 FinFET_14nm/22nm 예제의
#     실제 fin 치수를 확인한 뒤, 기하학적으로 말이 되는 범위로 재확정할 것.
#     이 상태로 결론을 내리면 안 된다 — docs/technical-notes.md 4절 참고.
doe:
  x_name: "Ge_percent"
  x_levels: [20, 25, 30, 35, 40]        # ⚠ PLACEHOLDER — 확정 아님
  y_name: "recess_depth_nm"
  y_levels: [30, 40, 50, 60, 70]        # ⚠ PLACEHOLDER — 확정 아님
  baseline_point: "G30_R50"             # ⚠ PLACEHOLDER — 위 값 확정되면 재확인
  values_confirmed: false               # ★ true 로 바뀌기 전까지 위 레벨은 예시일 뿐

# --- 임계두께 경계선 공식 (docs/technical-notes.md 3절) -----------------
# 등고선 위에 오버레이할 두 경계선. Sentaurus 밖에서 별도 계산한다.
critical_thickness:
  people_bean_1985:
    formula: "Tc_nm = 1.23 * x^(-3.08)"   # x = Ge 몰분율(0~1)
    citation: "R. People, J. C. Bean, Appl. Phys. Lett. 47(3), 322-324 (1985); 1986 Erratum"
    note: "근사식. 원 논문 그래프와 대조해 오차 확인 필요 (docs/technical-notes.md 4절 #5)"
  luryi_suhir_1986:
    formula: "결함 없이 버티는 조건: fin_width_nm < 15 * Tc_nm(people_bean)"
    citation: "S. Luryi, E. Suhir, Appl. Phys. Lett. 49(3), 140-142 (1986)"
    note: "fin_width_nm 값은 geometry.fin_width_nm 확정 후 사용 (Phase 0 종속)"
