# =====================================================================
#  베이스라인 파라미터 — 이 파일이 모든 수치의 유일한 출처(Single Source of Truth)
#  출처: J. Kim et al., Micromachines 2022, 13(9), 1476
#  https://www.mdpi.com/2072-666X/13/9/1476
#
#  ★ 수정하려면 PR + 나머지 2인 승인. 직접 push 금지.
#  ★ SDE / SDevice / analysis 스크립트가 모두 이 파일을 참조한다.
# =====================================================================

meta:
  baseline_paper: "Kim et al., Micromachines 2022, 13(9), 1476"
  last_verified: "2026-08-03"
  verified_by: ""          # 논문과 대조한 사람 이름 (Phase 0에서 채울 것)

geometry:
  L_gate_nm: 20            # 물리적 게이트 길이
  D_recess_nm: 120         # 리세스 깊이 (AR = 6.0)
  t_gateox_nm: 5           # 게이트 산화막 두께
  D_BCAT_nm: 36            # ★스윕 변수 X — 질화막 두께 (공칭). 게이트 에치백 양으로 조절
  fin_width_nm:            # ← Phase 0에서 논문 확인 후 기입
  junction_depth_nm:       # ← Phase 0에서 논문 확인 후 기입
  device_width_um: 1.0     # 전류 정규화 폭. A/um 환산의 기준

materials:
  gate_metal: "Tungsten"
  gate_workfunction_eV: 4.8
  gate_oxide: "SiO2"
  spacer_nitride: "Si3N4"

doping:
  channel_type: "p"
  channel_conc_cm3: 1.0e18      # ← Phase 0에서 논문 확인 후 보정
  sd_peak_conc_cm3: 1.0e20      # ★스윕 변수 Y의 기준값 — 배수를 여기에 곱한다
  sd_type: "n"
  doping_multiplier: 1.00       # 격자점마다 덮어쓰는 값 (0.30~1.00)

bias:
  Vd_lin: 0.1              # 선형영역 드레인 전압 (Vth, SS 추출용)
  Vd_sat: 1.0              # 포화영역 드레인 전압 (DIBL, Ion, GIDL 추출용)
  Vg_min: -1.0             # Id-Vg 스윕 시작
  Vg_max: 2.8              # Id-Vg 스윕 끝 (VPP)
  Vg_step: 0.05
  V_bulk: 0.0

# --- DoE 격자 정의 (analysis 스크립트가 읽는다) ---
doe:
  x_name: "D_BCAT_nm"
  x_levels: [24, 30, 36, 42, 48]
  y_name: "doping_multiplier"
  y_levels: [0.30, 0.50, 0.70, 0.85, 1.00]
  baseline_point: "D36_N100"
