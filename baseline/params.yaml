# =====================================================================
#  베이스라인 파라미터 — 이 파일이 모든 수치의 유일한 출처(Single Source of Truth)
#
#  ★ 2026-08-05 개정: 결함 경계(People-Bean/Luryi-Suhir) 프레이밍을 폐기하고
#    Stress Transfer Efficiency(STE) 프레이밍으로 전환. 아래 geometry/materials
#    값들은 Sentaurus 표준 예제 FinFET_14nm(Munkang Choi, Synopsys, 2013 —
#    학술 논문 아님) 스크립트를 실제로 열어 확인한 값이다. 이전까지 PLACEHOLDER
#    였던 항목이 이번에 채워졌다 — 완전히 다른 수치로 바뀐 게 아니라 없던 값을
#    찾아 채운 것이다. 옛 people_bean/luryi_suhir 섹션은 이 개정에서 제거했다
#    (git 이력 또는 docs/technical-notes.md 에서 참고 가능).
#
#  ★ 아래 값 중 값이 비어있거나 "TODO"라고 적힌 것은 여전히 팀이 확정해야 한다.
#    확정 전까지는 그 숫자를 "baseline 값"으로 인용하지 말 것.
#
#  ★ 수정하려면 PR + 나머지 2인 승인. 직접 push 금지.
#  ★ SDE / SDevice / analysis 스크립트가 모두 이 파일을 참조한다.
# =====================================================================

meta:
  baseline_source: "Synopsys Sentaurus 표준 예제 FinFET_14nm (Munkang Choi, Synopsys, 2013) — 학술 논문 아님"
  reference_paper_for_ste: "Choi et al. 2012 — 'Stress Transfer Efficiency' 용어 및 근접효과(nested/isolated) 데이터 출처. 팀은 이 용어의 선행 사용 여부를 더 검증하지 않기로 함 (README.md 참고, 리스크로 남김)"
  last_verified: "2026-08-05"
  verified_by: ""              # 예제 파일을 직접 열어 대조한 사람 이름 (미기재 — 채울 것)

geometry:
  # ↓ Choi/Synopsys FinFET_14nm 예제에서 확인된 값. 확인자 이름은 verified_by 에 채울 것.
  L_gate_nm: 25                # 게이트 길이
  fin_height_nm: 35            # 핀 높이
  fin_bottom_width_nm: 15      # 핀 바닥 폭 (전체 폭)
  fin_half_width_nm: 7.5       # half-fin 대칭 도메인에서 쓰는 반폭 (= fin_bottom_width_nm / 2)
  fin_pitch_nm: 48
  symmetry: "half-fin (Ymin=0, Ymax=0.5*Fpitch)"
  gate_material_present: false # ★ 이 서브구조엔 게이트 재질이 없다 — 순수 응력 계산용
  device_width_um: 1.0         # STE 계산엔 불필요(비율 지표라 폭 정규화 없음). 향후 확장 대비 유지

materials:
  channel: "Silicon"
  epi_sd: "SiGe"                # Embedded Source/Drain 재질
  ge_fraction_nominal: 0.50     # ★ GeMoleFraction 기본값(pMOS) — 공칭(baseline) 조건
  esd_parameterized: true        # S/D-채널 가로 근접거리(Esd) — 예제에 이미 파라미터화됨
  gate_workfunction_eV: null    # 해당 없음 — 이 서브구조엔 게이트 재질 자체가 없음 (gate_material_present: false)
  gate_oxide: null              # 해당 없음 (위와 동일 이유)

doping:
  # ⚠ TODO — Ge% 외 도핑 관련 값은 아직 예제에서 확인하지 않음
  sd_type: "p"                  # S/D(SiGe:B) — pMOS 응력공학
  sd_boron_conc_cm3:            # TODO — 예제에서 확인 필요

output:
  stress_fields_already_extracted: true   # StressELXX/YY/ZZ 가 이미 doping 명령으로 출력되고 있음 — 추출 자체는 가능, 후처리만 하면 됨

# --- DoE 격자 정의 (analysis 스크립트가 읽는다) -------------------------
# ⚠⚠⚠ 아래 x_levels/y_levels는 확정값이 아니라 파이프라인이 돌아가는지
#     확인하기 위한 예시(placeholder)다. 특히 y(FR)는 스크립트에 아직 없는
#     완전히 새로운 변수라, 추가 방법(docs/ROLES.md #4 유용성 과제)이
#     확인되기 전까지는 스윕 자체가 불가능하다.
doe:
  x_name: "Ge_percent"
  x_levels: [30, 40, 50, 60, 70]        # ⚠ PLACEHOLDER — 확정 아님. 50이 공칭(중앙)
  y_name: "FR_nm"                        # ★ 리세스 깊이(fin 바닥 아래 방향) — 신규 변수
  y_levels: [0, 10, 20, 30, 40]          # ⚠ PLACEHOLDER — 확정 아님. Gendron-Hansen 2015(SISPAD)는 FR≥10nm에서 응력 최대라고 명시(결함 형성은 범위 밖)
  baseline_point: "G50_F0"               # ⚠ PLACEHOLDER — FR=0이 예제 원본 상태와 같은지부터 확인 필요
  values_confirmed: false                # ★ true 로 바뀌기 전까지 위 레벨은 예시일 뿐

# --- Stress Transfer Efficiency 계산 (docs/technical-notes.md 참고 예정) -
stress_transfer_efficiency:
  vegard_law:
    formula: "f(x) = 0.042 * x"    # x = Ge 몰분율(0~1) → 명목 격자 부정합
    note: "일반 SiGe 합금 격자상수 근사식. 정확한 출처(논문) 인용이 필요하면 추가 확인할 것 — 미확인"
  normalization:
    channel_adjacent_point: null    # ⚠ TODO — "채널 인접" 지점의 정확한 좌표 정의. 팀 확정 필요 (docs/ROLES.md 4절 남다연 과제 결과 참고)
    stress_to_GPa_method: null      # ⚠ TODO — StressEL 출력을 GPa로 환산하는 방법. 팀 확정 필요
    note: "이 두 항목이 null 인 동안 ste 값은 참고용이지 결론이 아니다 (README.md 참고)"

# --- Strain_Impact 응력-이동도 결합 검증 (Phase 0 체크리스트 항목) -------
verification:
  strain_impact_coupling:
    status: "confirmed"           # Strain_Impact=1 vs 0 SWB 비교로 응력->전기 결합이 실제로 작동하는지 확인
    checked_point: "G50_F0 (Ge=0.50, FR=0)"
    checked_date: "2026-08-06"
    checked_by: "유용성 (Claude 보조 확인)"
    evidence_csv: "baseline/verification_strain_impact_G50F0.csv"
    key_deltas:
      IdSat_norm: "1.704e-4(S=0) -> 5.574e-4(S=1), +227%"
      IdLin_norm: "7.189e-5(S=0) -> 1.984e-4(S=1), +176%"
      gmSat: "4.925e-5(S=0) -> 1.063e-4(S=1), +116%"
      VtiSat_abs_V: "0.525(S=0) -> 0.403(S=1), -23% (pMOS |Vth| 감소)"
      SSSat_mV_dec: "549.8(S=0) -> 183.5(S=1)"
    note: "방향성(Ion 증가, |Vth| 감소)이 eSiGe pMOS 문헌(압축응력->정공 이동도 증가, 밸런스밴드 효과로 |Vth| 감소)과 일치. SDevice의 응력->전기 결합이 실제로 작동함을 확인. 단 SSSat 절대값(183~550mV/dec)은 이상적 60mV/dec 대비 매우 높음 — gate_material_present:false(게이트 스택 미완성) 영향으로 추정, 별도 확인 필요."

# --- [제거됨] 결함 경계 임계두께 공식 (people_bean_1985 / luryi_suhir_1986) --
# 2026-08-05 이전 버전엔 이 섹션이 있었다. baseline 치수(fin 반폭 7.5nm)에서
# Ge 42~100% 전 구간이 이론상 "무제한 보호"로 계산되어 결함 경계 프레이밍을
# 폐기했으므로 제거함. 공식·출처는 git 이력 또는 이전 docs/technical-notes.md
# 버전에서 확인 가능 (완전히 폐기된 게 아니라 "이 baseline 치수에서는 판별력이
# 없다"는 것으로, 다른 치수를 다루게 되면 다시 꺼내 쓸 수 있다).
