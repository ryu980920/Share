# runs/ 에 CSV 가 push 되면 지표를 다시 뽑고 대시보드를 갱신한다.
# → 팀원은 CSV 만 올리면 되고, build.py 를 아무도 기억할 필요가 없다.
name: update-dashboard

on:
  push:
    branches: [main]
    paths: ['runs/**', 'analysis/**', 'baseline/params.yaml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - run: pip install -r analysis/requirements.txt

      - name: 지표 추출 + 격자 구성
        run: python analysis/build.py || true

      - name: 등고선 (데이터가 4점 이상일 때만)
        run: python analysis/contour.py --all-figures || echo "데이터 부족 — 건너뜀"

      - name: 결과 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f analysis/status.json analysis/grid.csv analysis/figures 2>/dev/null || true
          git diff --staged --quiet || git commit -m "대시보드 자동 갱신 [skip ci]"
          git push
