# =====================================================================
# 분석 지표 정의 — 최종 기준
#
# 2026-08-27 최종 제출 보고서와 동기화.
# STE는 ChFin 체적평균 채널 길이 방향 응력(SlFin)을 분자로 사용한다.
# =====================================================================

stress:
  metric_name: "stress_GPa"
  source_metric: "SlFin"
  definition: "ChFin 영역의 채널 길이 방향 체적평균 응력"
  component: "StressEL-ZZ"
  input_unit: "MPa"
  output_unit: "GPa"
  conversion: "stress_GPa = SlFin_MPa / 1000"

ste:
  metric_name: "ste"
  adopted: true
  definition: "명목 SiGe 응력 대비 실제 ChFin 체적평균 채널 응력의 전달 효율"
  formula: "abs(stress_GPa) / (180.0 * 0.042 * (Ge_percent / 100.0))"
  biaxial_modulus_GPa: 180.0
  vegard_coefficient: 0.042
  numerator: "stress_GPa (SlFin 체적평균)"
  selection_basis: "SlFin은 모든 Ge 조건에서 gmSat과 +0.95 이상 상관; 계면 단일점 방식은 평균 약 -0.207"

vth:
  method: "constant_current"
  I_crit_A_per_um: 1.0e-7

# =====================================================================
# Sentaurus Workbench Export Variables 매핑
#
# Ge: 몰분율(0~1) -> build.py에서 %로 변환
# FR: um -> build.py에서 nm로 변환
# =====================================================================
swb:
  x_param: "Ge"
  y_param: "FR"
  map:
    SlFin_MPa: "SlFin"
    SlFin_pt_MPa: "SlFin_pt"
    VtiSat: "VtiSat"
    VtiLin: "VtiLin"
    IdSat_norm: "IdSat_norm"
    IdLin_norm: "IdLin_norm"
    SSlin: "SSlin"
    SSSat: "SSSat"
    gmSat: "gmSat"
    gmLin: "gmLin"
    Ioff_norm: "Ioff_norm"

# =====================================================================
# 지표 해석 원칙
# =====================================================================
interpretation:
  electrostatics_metric: "SSlin"
  leakage_metric: "Ioff_norm"
  short_channel_metric: "DIBL_mV_V"
  mobility_proxy: "gmSat"
  notes:
    - "SSSat은 게이트 제어와 드레인 접합 누설이 섞이므로 60 mV/dec 기준과 직접 비교하지 않는다."
    - "정전제어는 SSlin, 누설은 Ioff_norm, 드레인 장벽 영향은 DIBL로 분리해 평가한다."

# =====================================================================
# 첨부물 — runs/attachments/<run_id>/
# =====================================================================
attachments:
  dir: "runs/attachments"
  notes_file: "notes.md"
  notes_preview_chars: 160
