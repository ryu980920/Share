# =====================================================================
#  과제 자동 완료 체크 규칙
#
#  analysis/check_tasks.py 가 이 파일을 읽어서, 조건을 만족하면
#  analysis/progress.json 의 해당 [n][owner] 를 자동으로 true 로 바꾼다.
#  ★ false -> true 로만 움직인다. 이미 true 인 값(수동 체크 포함)은 안 건드림.
#  ★ 대시보드에서 수동으로 체크 해제해도, 파일이 그대로 있으면 다음 push 때
#    다시 true 로 돌아간다 — "파일 존재 = 완료"가 이 규칙의 기준이기 때문.
#    잘못 자동 체크된 걸 진짜로 끄고 싶으면 이 파일에서 규칙 자체를 지울 것.
#
#  ★ 왜 #1/#3/#4/#5(P0 게이트 과제)는 없는가:
#    이 넷은 PR 승인, 3인 교차대조(stress_GPa 5% 이내) 같은 "팀의 판단"이
#    완료 조건이다. 파일 하나 올라왔다고 자동으로 "팀이 확인했다"고 처리하면
#    baseline/README.md 의 검증 절차 자체를 무력화하는 것 — 그래서 의도적으로
#    규칙을 안 넣었다. 이 넷은 대시보드에서 직접 체크할 것.
# =====================================================================

rules:
  - n: 7
    owner: "유용성"
    any_exists: ["docs/model_choice.md"]

